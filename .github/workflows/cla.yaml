name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA check
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token with write access to OssaNetwork/contributors, where signatures are stored.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_CONTRIBUTORS_TOKEN }}
        with:
          remote-organization-name: 'OssaNetwork'
          remote-repository-name: 'contributors'
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/OssaNetwork/ossa/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'dependabot[bot],github-actions[bot]'
