[package]
name = "ossa-typeable"
version = "0.0.1"
edition = "2021"
license = "MPL-2.0"
description = "Unique identifiers for types."
homepage = "https://github.com/jprider63/ossa"
repository = "https://github.com/jprider63/ossa"

[features]
im = ["dep:im"]
serde = ["dep:serde"]
ed25519-dalek = ["dep:ed25519-dalek"]


[dependencies]
lazy_static = { workspace = true }
im = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
sha2 = { workspace = true }
ossa-typeable-derive = { workspace = true }
ed25519-dalek = { workspace = true, optional = true }
